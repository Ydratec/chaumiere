<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usine de Noël — prototype</title>
<style>
@font-face { font-family:"Chaumiere Pixel"; src:url(usine/ui/chaumiere-pixel.ttf) format("truetype"); font-display:block; }
:root { --bg:#1b120d; --text:#fff3dd; --ink:#3d2216; --muted:#e0c49a; --gold:#f6c445; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/22px "Chaumiere Pixel", monospace; -webkit-font-smoothing:none; }
body { display:flex; flex-direction:column; image-rendering:pixelated; }
img, .ic, .it, .pic, .slot, canvas { image-rendering:pixelated; }
.shadow { text-shadow:2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink); }
/* ---------- cadres 9-slice ---------- */
.frame { border:16px solid transparent; border-image:url(usine/ui/cadre.png) 8 fill / 16px stretch; }
.frame-plain { border:16px solid transparent; border-image:url(usine/ui/cadre_sans_neige.png) 8 fill / 16px stretch; }
.card { border:8px solid transparent; border-image:url(usine/ui/carte_sombre.png) 4 fill / 8px stretch; padding:2px 4px; margin:6px 0; }
/* ---------- boutons : 4 couleurs × 4 états ---------- */
.btn { font:inherit; color:var(--text); background:none; cursor:pointer; border-style:solid; border-color:transparent; border-width:12px 12px 16px 12px;
  padding:0 2px; line-height:16px; min-height:44px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  text-shadow:2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink);
  border-image:url(usine/ui/bouton_bois_normal.png) 6 6 8 6 fill / 12px 12px 16px 12px stretch; }
.btn:hover:not(:disabled) { border-image-source:url(usine/ui/bouton_bois_survol.png); }
.btn:active:not(:disabled) { border-image-source:url(usine/ui/bouton_bois_appuye.png); }
.btn:disabled { border-image-source:url(usine/ui/bouton_bois_desactive.png); cursor:default; color:#d9d2c6; }
.btn.or, .btn.on { border-image-source:url(usine/ui/bouton_or_normal.png); color:var(--ink); text-shadow:none; }
.btn.or:hover:not(:disabled), .btn.on:hover:not(:disabled) { border-image-source:url(usine/ui/bouton_or_survol.png); }
.btn.or:active:not(:disabled), .btn.on:active:not(:disabled) { border-image-source:url(usine/ui/bouton_or_appuye.png); }
.btn.rouge { border-image-source:url(usine/ui/bouton_rouge_normal.png); }
.btn.rouge:hover:not(:disabled) { border-image-source:url(usine/ui/bouton_rouge_survol.png); }
.btn.rouge:active:not(:disabled) { border-image-source:url(usine/ui/bouton_rouge_appuye.png); }
.btn.vert { border-image-source:url(usine/ui/bouton_vert_normal.png); }
.btn.vert:hover:not(:disabled) { border-image-source:url(usine/ui/bouton_vert_survol.png); }
.btn.vert:active:not(:disabled) { border-image-source:url(usine/ui/bouton_vert_appuye.png); }
.btn.vert:disabled, .btn.or:disabled, .btn.rouge:disabled { border-image-source:url(usine/ui/bouton_bois_desactive.png); color:#d9d2c6; }
.btn.sm { min-height:40px; border-width:10px 10px 14px 10px; border-image-width:10px 10px 14px 10px; }
.btn.wide { width:100%; justify-content:center; margin-top:6px; }
.btn.icon { padding:0; }
/* ---------- icônes ---------- */
.ic { display:inline-block; width:32px; height:32px; flex:none; vertical-align:middle; background:url(usine/ui/icones.png) calc(var(--i) * -32px) 0 / 736px 32px no-repeat; }
.it { display:inline-block; width:32px; height:32px; flex:none; vertical-align:middle; background:url(usine/commun/objets_16x16.png) calc(var(--i) * -32px) 0 / 1184px 32px no-repeat; }
.n { margin:0 4px 0 -4px; }
/* ---------- en-tête ---------- */
header { display:flex; align-items:center; gap:10px; padding:2px 6px; flex-wrap:nowrap; white-space:nowrap; overflow:hidden; margin:4px 4px 0; }
header h1 { font:inherit; font-size:24px; line-height:24px; margin:0 6px 0 0; color:var(--gold); }
.stat { display:inline-flex; align-items:center; gap:4px; }
.stat b { font-weight:normal; min-width:40px; }
#stage { color:var(--muted); }
.grow { flex:1; }
select { font:inherit; color:var(--text); background:#3d2216; border:4px solid #5e3620; padding:2px 4px; }
label.ck { display:inline-flex; align-items:center; gap:4px; margin:0; }
#avatar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
#avatar[hidden] { display:none; }
/* ---------- zone de jeu ---------- */
main { flex:1; display:flex; min-height:0; gap:4px; padding:4px; }
#view { position:relative; flex:1; min-width:0; overflow:hidden; background:#140d09; }
#cvwrap { position:absolute; inset:0; }
canvas { display:block; touch-action:none; cursor:pointer; }
#tools { position:absolute; left:4px; top:4px; display:flex; flex-direction:column; gap:0; }
#tools .btn { justify-content:center; min-width:56px; }
#rot::after { font-size:24px; }
#rot[data-r="0"]::after { content:"→"; } #rot[data-r="1"]::after { content:"↓"; } #rot[data-r="2"]::after { content:"←"; } #rot[data-r="3"]::after { content:"↑"; }
#bagwrap { position:absolute; left:50%; bottom:4px; transform:translateX(-50%); display:flex; align-items:center; gap:6px; margin:0; }
#bag { display:flex; gap:2px; }
.slot { position:relative; width:40px; height:40px; background:url(usine/ui/case_normale.png) 0 0 / 40px 40px; display:flex; align-items:center; justify-content:center; }
.slot .n { position:absolute; right:1px; bottom:-3px; margin:0; text-shadow:2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink); }
/* ---------- panneau ---------- */
aside { width:380px; display:flex; flex-direction:column; min-height:0; }
.tabs { display:flex; padding:0 10px; position:relative; z-index:1; margin-bottom:-12px; }
.tab { font:inherit; background:none; cursor:pointer; flex:1; padding:0; min-height:46px; border-style:solid; border-color:transparent; border-width:12px 12px 2px 12px;
  border-image:url(usine/ui/onglet_inactif.png) 6 6 1 6 fill / 12px 12px 2px 12px stretch; display:flex; justify-content:center; align-items:center; }
.tab.on { border-image-source:url(usine/ui/onglet_actif.png); }
#panel { flex:1; overflow:auto; padding:6px 6px 12px; }
h3 { font:inherit; color:var(--gold); margin:4px 0 6px; display:flex; align-items:center; gap:6px; }
p { margin:6px 0; }
.muted { color:var(--muted); }
.bad { color:#ff8a7a; display:flex; align-items:center; gap:4px; }
.row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:4px 0; }
.wrap { display:flex; flex-wrap:wrap; gap:4px; }
.chip { display:inline-flex; align-items:center; }
.gauge { border:6px solid transparent; border-image:url(usine/ui/jauge.png) 3 fill / 6px stretch; height:20px; margin:4px 0; }
.gauge i { display:block; height:8px; background:url(usine/ui/jauge_vert.png) 0 -4px / 8px 16px repeat-x; }
.gauge i.g-or { background-image:url(usine/ui/jauge_or.png); } .gauge i.g-rouge { background-image:url(usine/ui/jauge_rouge.png); } .gauge i.g-bleu { background-image:url(usine/ui/jauge_bleu.png); }
.grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:0; }
.tile { flex-direction:column; gap:0; padding:0; white-space:normal; text-align:center; line-height:16px; justify-content:flex-end; }
.tile small { font-size:16px; display:inline-flex; align-items:center; gap:2px; }
.tile .ic, h3 .it, .row .ic, .bad .ic { width:16px; height:16px; background-size:368px 16px; background-position:calc(var(--i) * -16px) 0; }
h3 .ic { width:32px; height:32px; background-size:736px 32px; background-position:calc(var(--i) * -32px) 0; }
.picbox { height:58px; width:76px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; }
.pic { display:block; background-repeat:no-repeat; background-position:0 0; transform-origin:bottom center; flex:none; }
label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
.rec { display:flex; align-items:center; gap:2px; padding:2px; flex-wrap:wrap; }
.rec.on { background:rgba(246,196,69,.18); }
.rec small { margin-left:auto; color:var(--muted); font-size:16px; }
.arrow { margin:0 4px; color:var(--gold); }
/* ---------- bulles ---------- */
#toast { position:absolute; left:50%; top:8px; transform:translate(-50%, -24px); max-width:min(560px, 86%); color:var(--ink); text-align:center;
  border:8px solid transparent; border-image:url(usine/ui/bulle.png) 4 fill / 8px stretch; padding:2px 6px; opacity:0; transition:.2s steps(3); pointer-events:none; z-index:3; }
#toast.on { opacity:1; transform:translate(-50%, 0); }
#confirm { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:9; }
#confirm.on { display:flex; }
#confirm .frame { max-width:340px; padding:8px; }
@media (max-width: 820px) {
  main { flex-direction:column; }
  aside { width:auto; height:46%; }
  header { gap:6px; flex-wrap:nowrap; overflow-x:auto; white-space:nowrap; }
  header h1, #stage { display:none; }
  #bagwrap .lbl, #bagwrap > .ic { display:none; }
  .slot { width:34px; height:34px; background-size:34px 34px; }
  .slot .it { transform:scale(.85); }
  #reset { display:none; }
  #tools { flex-direction:row; flex-wrap:wrap; right:4px; gap:0; }
  #tools .btn { min-width:40px; min-height:34px; border-width:8px 8px 12px 8px; border-image-width:8px 8px 12px 8px; }
  #tools .ic { width:16px; height:16px; background-size:368px 16px; background-position:calc(var(--i) * -16px) 0; }
  #rot::after { font-size:16px; }
  .frame, .frame-plain { border-width:12px; border-image-width:12px; }
}
</style>
</head>
<body>
<header class="frame">
  <h1 class="shadow">Usine de Noël</h1>
  <span class="stat shadow"><span class="ic" style="--i:0"></span><b id="coins">0</b></span>
  <span class="stat shadow"><span class="ic" style="--i:1"></span><b id="stars">0</b></span>
  <span id="stage" class="shadow"></span>
  <span class="grow"></span>
  <button class="btn sm" id="test" title="Temps ×5"><span class="ic" style="--i:19"></span>Test</button>
  <button class="btn sm" id="gift" title="Mode test : +1 000 pièces">+1 000</button>
  <button class="btn sm rouge" id="reset">Recommencer</button>
</header>
<main>
  <div id="view" class="frame-plain">
    <div id="cvwrap"><canvas id="game"></canvas></div>
    <div id="tools">
      <button class="btn icon" data-mode="hand" title="Main : se déplacer et agir (1)"><span class="ic" style="--i:2"></span></button>
      <button class="btn icon" data-mode="build" title="Construire (2)"><span class="ic" style="--i:3"></span></button>
      <button class="btn icon" data-mode="inspect" title="Inspecter (3)"><span class="ic" style="--i:4"></span></button>
      <button class="btn icon" data-mode="demolish" title="Démonter (4)"><span class="ic" style="--i:5"></span></button>
      <button class="btn icon shadow" id="rot" title="Tourner (R)" data-r="0"></button>
      <button class="btn icon" id="zin" title="Zoom +"><span class="ic" style="--i:7"></span></button>
      <button class="btn icon" id="zout" title="Zoom −"><span class="ic" style="--i:8"></span></button>
    </div>
    <div id="bagwrap" class="card"><span class="ic" style="--i:9"></span><span class="lbl shadow">Sac</span><div id="bag"></div></div>
    <div id="toast"></div>
  </div>
  <aside>
    <div class="tabs">
      <button class="tab" data-tab="commandes" title="Commandes"><span class="ic" style="--i:17"></span></button>
      <button class="tab" data-tab="marche" title="Marché"><span class="ic" style="--i:10"></span></button>
      <button class="tab" data-tab="construire" title="Construire"><span class="ic" style="--i:3"></span></button>
      <button class="tab" data-tab="progression" title="Progression"><span class="ic" style="--i:18"></span></button>
      <button class="tab" data-tab="selection" title="Sélection"><span class="ic" style="--i:4"></span></button>
    </div>
    <div id="panel" class="frame"></div>
  </aside>
</main>
<div id="avatar" hidden><select id="species" aria-label="Espèce"></select><select id="acolor" aria-label="Couleur"></select><label class="ck"><input type="checkbox" id="santa"> Bonnet</label></div>
<div id="confirm"><div class="frame"><p class="shadow">Effacer la partie et recommencer à l'étape 1 ?</p><div class="row"><button id="cyes" class="btn rouge">Effacer</button><button id="cno" class="btn">Annuler</button></div></div></div>
<script src="meta.js"></script>
<script src="game.js"></script>
</body>
</html>
